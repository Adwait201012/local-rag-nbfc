# Local RAG stack for a single 12 GB Blackwell GPU (RTX 5070).
#
#   docker compose up -d --build      start db + embeddings + ollama + api
#   make ingest                       index files in ./corpus
#
# GPU residency at steady state:
#   ollama      qwen3:8b Q4_K_M          ~5.2 GB
#   embeddings  bge-m3 + bge-reranker    ~2.5 GB
#   ingest      runs on CPU by design    0 GB
#   ------------------------------------------
#   total                                ~7.7 GB of 12 GB

services:
  db:
    image: pgvector/pgvector:pg17
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-rag}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ragpass}
      POSTGRES_DB: ${POSTGRES_DB:-rag}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    ports:
      - "5433:5432"          # host port 5433 avoids clashing with a local Postgres
    shm_size: 1gb
    command:
      - postgres
      - -c
      - shared_buffers=2GB
      - -c
      - maintenance_work_mem=2GB    # HNSW index builds are memory-hungry
      - -c
      - work_mem=64MB
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-rag} -d ${POSTGRES_DB:-rag}"]
      interval: 5s
      timeout: 3s
      retries: 30

  embeddings:
    build: ./embeddings
    restart: unless-stopped
    environment:
      EMBED_MODEL: ${EMBED_MODEL:-BAAI/bge-m3}
      RERANK_MODEL: ${RERANK_MODEL:-BAAI/bge-reranker-v2-m3}
      HF_HOME: /models
    volumes:
      - ${HF_CACHE:-./models}:/models        # weights cached on your SSD, downloaded once
    ports:
      - "8081:8081"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8081/health').status==200 else 1)\""]
      interval: 15s
      timeout: 10s
      retries: 40           # first boot downloads ~2.5 GB of weights
      start_period: 120s

  ollama:
    image: ollama/ollama:latest
    restart: unless-stopped
    environment:
      OLLAMA_KEEP_ALIVE: "-1"       # keep the model resident; no reload latency per query
      OLLAMA_NUM_PARALLEL: "1"      # 12 GB does not have room for parallel KV caches
    volumes:
      - ollama:/root/.ollama
    ports:
      - "11434:11434"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

  api:
    build: ./api
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-rag}:${POSTGRES_PASSWORD:-ragpass}@db:5432/${POSTGRES_DB:-rag}
      EMBED_URL: http://embeddings:8081
      OLLAMA_URL: http://ollama:11434
      LLM_MODEL: ${LLM_MODEL:-qwen3:8b}
      NUM_CTX: ${NUM_CTX:-8192}
      TOP_K_CANDIDATES: ${TOP_K_CANDIDATES:-40}
      TOP_K_FINAL: ${TOP_K_FINAL:-6}
      INGEST_URL: http://ingest:8082
      APP_PASSWORD: ${APP_PASSWORD:-}
      SESSION_SECRET: ${SESSION_SECRET:-rag-dev-secret}
    volumes:
      - ./corpus:/data
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy
      embeddings:
        condition: service_started
      ollama:
        condition: service_started

  # Serial ingestion queue. `make ingest` / `make reindex` override the worker
  # entrypoint for a one-shot batch run.
  ingest:
    build: ./ingest
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-rag}:${POSTGRES_PASSWORD:-ragpass}@db:5432/${POSTGRES_DB:-rag}
      EMBED_URL: http://embeddings:8081
      MAX_TOKENS: ${CHUNK_MAX_TOKENS:-512}
      OCR_LANGUAGES: ${OCR_LANGUAGES:-hin,eng}
      OCR_FORCE_FULL_PAGE: ${OCR_FORCE_FULL_PAGE:-false}
      HF_HOME: /models
    volumes:
      - ./corpus:/data
      - ${HF_CACHE:-./models}:/models
      - ${OCR_CACHE:-./ocr-models}:/usr/local/lib/python3.12/site-packages/rapidocr/models
      - ./eval:/eval
    depends_on:
      db:
        condition: service_healthy
      embeddings:
        condition: service_healthy
    entrypoint: ["uvicorn", "worker:app", "--host", "0.0.0.0", "--port", "8082"]
    ports:
      - "8082:8082"

volumes:
  pgdata:
  ollama:
