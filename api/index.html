<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Local knowledge base</title>
<style>
  :root{
    --ink:#161a20; --panel:#1e242c; --line:#2c343f;
    --text:#dde3ea; --muted:#8b9aa8;
    --signal:#5ec8c0;      /* retrieval / dense */
    --warm:#e0a44a;        /* rerank / lexical */
    --mono: ui-monospace, "SF Mono", "JetBrains Mono", Menlo, Consolas, monospace;
    --sans: system-ui, -apple-system, "Segoe UI", Inter, sans-serif;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--ink);color:var(--text);font-family:var(--sans);line-height:1.55}
  header{border-bottom:1px solid var(--line);padding:14px 22px;display:flex;gap:16px;align-items:baseline;flex-wrap:wrap}
  h1{font:600 15px/1 var(--mono);letter-spacing:.14em;text-transform:uppercase;margin:0}
  #stats{font:12px var(--mono);color:var(--muted)}
  main{display:grid;grid-template-columns:minmax(0,1fr) 380px;gap:0;min-height:calc(100vh - 52px)}
  #left{padding:22px;min-width:0}
  #right{border-left:1px solid var(--line);padding:22px;overflow:auto;background:#171c23}
  form{display:flex;gap:8px}
  input{flex:1;background:var(--panel);border:1px solid var(--line);border-radius:6px;
        color:var(--text);padding:12px 14px;font:15px var(--sans)}
  input:focus{outline:2px solid var(--signal);outline-offset:1px}
  button{background:var(--signal);color:#0d1114;border:0;border-radius:6px;padding:0 20px;
         font:600 14px var(--sans);cursor:pointer}
  button:disabled{opacity:.45;cursor:progress}
  #answer{margin-top:24px;white-space:pre-wrap;font-size:15.5px;max-width:70ch}
  #answer cite{font-style:normal;color:var(--signal);font-family:var(--mono);font-size:.9em}
  .empty{color:var(--muted);max-width:60ch}
  .empty code{font-family:var(--mono);color:var(--warm)}
  h2{font:600 11px/1 var(--mono);letter-spacing:.16em;text-transform:uppercase;
     color:var(--muted);margin:0 0 14px}
  .src{border-top:1px solid var(--line);padding:12px 0}
  .src:first-of-type{border-top:0}
  .src-head{display:flex;gap:8px;align-items:baseline;font:12px var(--mono)}
  .rank{color:var(--signal)}
  .name{color:var(--text);overflow-wrap:anywhere}
  .loc{color:var(--muted);font:11px var(--mono);margin-top:2px}
  /* signature: every passage shows how it earned its place —
     fusion rank from hybrid search, then the cross-encoder's verdict */
  .bars{margin-top:8px;display:grid;grid-template-columns:52px 1fr;gap:4px 8px;align-items:center}
  .bars span{font:10px var(--mono);color:var(--muted);letter-spacing:.06em}
  .bar{height:3px;background:#2a323c;border-radius:2px;overflow:hidden}
  .bar i{display:block;height:100%}
  .bar.fuse i{background:var(--signal)}
  .bar.rank i{background:var(--warm)}
  @media(max-width:860px){main{grid-template-columns:1fr}#right{border-left:0;border-top:1px solid var(--line)}}
</style>
</head>
<body>
<header>
  <h1>Local knowledge base</h1>
  <span id="stats">connecting…</span>
</header>
<main>
  <div id="left">
    <form id="ask">
      <input id="q" placeholder="Ask something the indexed documents can answer" autocomplete="off" autofocus>
      <button id="go" type="submit">Ask</button>
    </form>
    <div id="answer" class="empty">
      Answers come only from what you have indexed. Add files to your corpus folder and run
      <code>docker compose run --rm ingest /data</code>, then ask away.
    </div>
  </div>
  <div id="right">
    <h2>Passages used</h2>
    <div id="sources" class="empty" style="font-size:13px">Retrieved passages appear here, with the score each one earned.</div>
  </div>
</main>
<script>
const $ = s => document.querySelector(s);

fetch('/health').then(r => r.json()).then(h => {
  const d = h.db && h.db.documents !== undefined
    ? `${h.db.documents} documents · ${h.db.chunks} chunks`
    : 'database not ready';
  $('#stats').textContent = `${d} · embeddings ${h.embeddings} · ollama ${h.ollama}`;
}).catch(() => $('#stats').textContent = 'api unreachable');

function renderSources(list){
  const box = $('#sources');
  if(!list.length){ box.className='empty'; box.textContent='No passage matched. Try different wording, or index more documents.'; return; }
  box.className='';
  const scores = list.map(s => s.rerank_score ?? 0);
  const lo = Math.min(...scores), hi = Math.max(...scores);
  const norm = v => hi === lo ? 1 : (v - lo) / (hi - lo);
  box.innerHTML = list.map((s,i) => {
    const file = s.source.split('/').pop();
    const loc = [s.page ? 'p.' + s.page : null, s.heading].filter(Boolean).join(' · ');
    return `<div class="src">
      <div class="src-head"><span class="rank">[${i+1}]</span><span class="name">${esc(file)}</span></div>
      ${loc ? `<div class="loc">${esc(loc)}</div>` : ''}
      <div class="bars">
        <span>hybrid</span><div class="bar fuse"><i style="width:${(1-i/list.length)*100}%"></i></div>
        <span>rerank</span><div class="bar rank"><i style="width:${(0.15+0.85*norm(s.rerank_score ?? 0))*100}%"></i></div>
      </div>
    </div>`;
  }).join('');
}

const esc = t => String(t).replace(/[&<>]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));

$('#ask').addEventListener('submit', async e => {
  e.preventDefault();
  const query = $('#q').value.trim();
  if(!query) return;
  $('#go').disabled = true;
  const out = $('#answer');
  out.className = ''; out.textContent = '';
  $('#sources').className = 'empty'; $('#sources').textContent = 'retrieving…';

  try{
    const res = await fetch('/api/chat', {
      method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({ query })
    });
    const reader = res.body.getReader();
    const dec = new TextDecoder();
    let buf = '', event = '';
    while(true){
      const {done, value} = await reader.read();
      if(done) break;
      buf += dec.decode(value, {stream:true});
      const parts = buf.split('\n\n'); buf = parts.pop();
      for(const block of parts){
        for(const line of block.split('\n')){
          if(line.startsWith('event: ')) event = line.slice(7).trim();
          else if(line.startsWith('data: ')){
            const data = JSON.parse(line.slice(6));
            if(event === 'sources') renderSources(data);
            if(event === 'token'){ out.textContent += data; }
          }
        }
      }
    }
    out.innerHTML = esc(out.textContent).replace(/\[(\d+)\]/g, '<cite>[$1]</cite>');
  }catch(err){
    out.className = 'empty';
    out.textContent = 'The request failed: ' + err.message + '. Check docker compose logs api.';
  }finally{
    $('#go').disabled = false;
  }
});
</script>
</body>
</html>
